<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2026 義大利自由行完整行程手冊">
  <title>2026 義大利自由行｜完整行程手冊</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root { --ink:#24342d; --muted:#68776f; --cream:#fbf7ef; --paper:#fffdf9; --green:#315d50; --red:#a64d3c; --gold:#c59645; --line:#e7ded0; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--cream); font-family: -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; line-height:1.8; }
    .hero { padding:4.5rem 1.25rem 3.75rem; color:#fff; background:linear-gradient(135deg,rgba(28,70,58,.96),rgba(73,49,35,.92)), radial-gradient(circle at 85% 20%,#c59645,transparent 35%); }
    .hero-inner { max-width:1180px; margin:auto; }
    .eyebrow { letter-spacing:.18em; font-size:.78rem; opacity:.8; }
    h1 { margin:.55rem 0 .4rem; font-family:Georgia,"Noto Serif TC",serif; font-size:clamp(2rem,5vw,4.1rem); line-height:1.2; }
    .hero p { max-width:760px; margin:.75rem 0 0; font-size:1.05rem; opacity:.9; }
    .layout { display:grid; grid-template-columns:260px minmax(0,1fr); gap:2.5rem; max-width:1180px; margin:0 auto; padding:2rem 1.25rem 5rem; }
    aside { position:sticky; top:1rem; align-self:start; max-height:calc(100vh - 2rem); overflow:auto; padding:1.1rem; background:rgba(255,253,249,.8); border:1px solid var(--line); border-radius:16px; }
    aside h2 { margin:.1rem 0 .7rem; font-size:1rem; }
    #toc a { display:block; padding:.25rem 0; color:var(--green); text-decoration:none; font-size:.9rem; line-height:1.5; }
    #toc a:hover { color:var(--red); }
    main { min-width:0; background:var(--paper); padding:clamp(1.25rem,3vw,3rem); border:1px solid var(--line); border-radius:18px; box-shadow:0 16px 50px rgba(70,45,20,.06); }
    main h2 { margin-top:2.6rem; padding-top:1rem; border-top:2px solid var(--line); color:var(--green); font-family:Georgia,"Noto Serif TC",serif; }
    main h3 { margin-top:2rem; color:var(--red); }
    main h4 { color:var(--green); }
    main a { color:var(--red); }
    main blockquote { margin:1.25rem 0; padding:.75rem 1rem; background:#f5eee2; border-left:4px solid var(--gold); color:#5b5145; }
    main table { width:100%; border-collapse:collapse; display:block; overflow-x:auto; margin:1rem 0 1.5rem; }
    main th, main td { min-width:110px; padding:.6rem .75rem; border:1px solid var(--line); text-align:left; vertical-align:top; }
    main th { background:#edf2eb; color:var(--green); }
    main code { padding:.12rem .35rem; background:#f0ece4; border-radius:4px; }
    main img { max-width:100%; }
    .status { padding:.85rem 1rem; color:var(--muted); background:#fff; border:1px dashed var(--line); border-radius:10px; }
    @media (max-width:800px) { .layout { display:block; padding:1rem .7rem 3rem; } aside { position:relative; top:auto; max-height:none; margin-bottom:1rem; } #toc { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.15rem .8rem; } main { padding:1.1rem; border-radius:12px; } .hero { padding:3rem 1rem 2.5rem; } }
  </style>
</head>
<body>
  <header class="hero"><div class="hero-inner">
    <div class="eyebrow">ITALIA · 2026 TRAVEL JOURNAL</div>
    <h1>🇮🇹 2026 義大利自由行</h1>
    <p>完整行程手冊｜羅馬 → 佛羅倫斯 → 威尼斯 Mestre → 羅馬</p>
  </div></header>
  <div class="layout">
    <aside><h2>行程導覽</h2><nav id="toc"><div class="status">正在載入行程…</div></nav></aside>
    <main id="content"><div class="status">正在載入 Markdown…</div></main>
  </div>
  <script>
    async function loadItinerary() {
      const content = document.getElementById('content');
      const toc = document.getElementById('toc');
      try {
        const response = await fetch('itinerary.md');
        if (!response.ok) throw new Error('Markdown 載入失敗');
        const markdown = await response.text();
        content.innerHTML = marked.parse(markdown);
        const headings = [...content.querySelectorAll('h2, h3')];
        toc.innerHTML = headings.map((heading, index) => {
          const id = 'section-' + index;
          heading.id = id;
          return `<a href="#${id}" style="padding-left:${heading.tagName === 'H3' ? '1rem' : '0'}">${heading.textContent}</a>`;
        }).join('');
      } catch (error) {
        content.innerHTML = '<div class="status">無法載入行程內容，請確認 itinerary.md 與本頁位於同一個資料夾。</div>';
        toc.innerHTML = '';
      }
    }
    loadItinerary();
  </script>
</body>
</html>
