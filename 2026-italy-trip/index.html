<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2026 義大利自由行完整行程手冊">
  <title>2026 義大利自由行｜完整行程手冊</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root { --ink:#24342d; --muted:#68776f; --cream:#fbf7ef; --paper:#fffdf9; --green:#315d50; --red:#a64d3c; --gold:#c59645; --line:#e7ded0; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; padding-bottom:4.5rem; color:var(--ink); background:var(--cream); font-family: -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; line-height:1.8; }
    .hero { padding:4.5rem 1.25rem 3.75rem; color:#fff; background:linear-gradient(135deg,rgba(28,70,58,.96),rgba(73,49,35,.92)), radial-gradient(circle at 85% 20%,#c59645,transparent 35%); }
    .hero-inner { max-width:1180px; margin:auto; }
    .eyebrow { letter-spacing:.18em; font-size:.78rem; opacity:.8; }
    h1 { margin:.55rem 0 .4rem; font-family:Georgia,"Noto Serif TC",serif; font-size:clamp(2rem,5vw,4.1rem); line-height:1.2; }
    .hero p { max-width:760px; margin:.75rem 0 0; font-size:1.05rem; opacity:.9; }
    .layout { max-width:960px; margin:0 auto; padding:2rem 1.25rem 5rem; }
    main { min-width:0; background:var(--paper); padding:clamp(1.25rem,3vw,3rem); border:1px solid var(--line); border-radius:18px; box-shadow:0 16px 50px rgba(70,45,20,.06); }
    main h2 { margin-top:2.6rem; padding-top:1rem; border-top:2px solid var(--line); color:var(--green); font-family:Georgia,"Noto Serif TC",serif; }
    main h3 { margin-top:2rem; color:var(--red); }
    main h4 { color:var(--green); }
    main a { color:var(--red); }
    main blockquote { margin:1.25rem 0; padding:.75rem 1rem; background:#f5eee2; border-left:4px solid var(--gold); color:#5b5145; }
    main table { width:100%; border-collapse:collapse; margin:1rem 0 1.5rem; }
    main th, main td { min-width:110px; padding:.6rem .75rem; border:1px solid var(--line); text-align:left; vertical-align:top; }
    main th { background:#edf2eb; color:var(--green); }
    main code { padding:.12rem .35rem; background:#f0ece4; border-radius:4px; }
    main td, main th, main a { overflow-wrap:anywhere; }
    main td .cell-value { grid-column:2; min-width:0; }
    main img { max-width:100%; }
    .status { padding:.85rem 1rem; color:var(--muted); background:#fff; border:1px dashed var(--line); border-radius:10px; }
    [hidden] { display:none !important; }
    .day-card { margin:1.25rem 0; border:1px solid var(--line); border-radius:14px; background:#fff; overflow:hidden; }
    .day-card summary { cursor:pointer; padding:1rem 1.15rem; color:var(--green); background:#edf2eb; font:700 1.15rem/1.4 Georgia,"Noto Serif TC",serif; list-style:none; }
    .day-card summary::-webkit-details-marker { display:none; }
    .day-card summary::before { content:"＋"; display:inline-block; width:1.4rem; color:var(--red); font:700 1.2rem/1 sans-serif; }
    .day-card[open] summary::before { content:"－"; }
    .day-card > :not(summary) { margin-left:1.15rem; margin-right:1.15rem; }
    main a.place-link { white-space:nowrap; overflow-wrap:normal; word-break:keep-all; display:inline-block; }
    .quick-tools { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; justify-content:center; padding:.45rem .75rem; background:rgba(255,253,249,.96); border-top:1px solid var(--line); box-shadow:0 -8px 25px rgba(36,52,45,.12); }
    .quick-panel { position:relative; display:flex; justify-content:center; gap:.5rem; width:min(100%,960px); }
    .quick-action { flex:1; max-width:14rem; padding:.65rem .8rem; border:1px solid var(--line); border-radius:10px; color:var(--green); background:#fff; cursor:pointer; font:600 .9rem/1.2 inherit; text-align:center; }
    .quick-action:hover { background:#edf2eb; }
    #quick-guide { max-height:65vh; overflow:auto; padding:.25rem 0; }
    #quick-guide a { display:block; padding:.2rem .25rem; color:var(--green); text-decoration:none; font-size:.82rem; line-height:1.45; }
    .modal { position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:1rem; background:rgba(25,40,34,.48); }
    .modal-card { width:min(100%,390px); padding:1.25rem; background:var(--paper); border:1px solid var(--line); border-radius:18px; box-shadow:0 18px 60px rgba(20,30,25,.25); }
    .modal-card h2 { margin:.1rem 0 .8rem; color:var(--green); font-family:Georgia,"Noto Serif TC",serif; }
    .modal-card label { display:block; margin:.7rem 0 .25rem; color:var(--muted); font-size:.9rem; }
    .modal-card input, .modal-card select { width:100%; padding:.65rem .7rem; border:1px solid var(--line); border-radius:8px; background:#fff; font:inherit; }
    .modal-row { display:flex; justify-content:space-between; align-items:center; gap:.8rem; margin-top:1rem; }
    .modal-close { border:0; color:var(--muted); background:transparent; cursor:pointer; font-size:1.4rem; }
    .rate-result { margin-top:1rem; padding:1.05rem .8rem; background:#edf2eb; border-radius:10px; color:var(--green); font-size:1.55rem; font-weight:800; line-height:1.35; text-align:center; }
    .rate-note { margin:.55rem 0 0; color:var(--muted); font-size:.78rem; line-height:1.5; }
    @media (max-width:800px) {
      .layout { padding:1rem .7rem 3rem; }
      main { padding:1.1rem; border-radius:12px; }
      .hero { padding:3rem 1rem 2.5rem; }
      main h2 { font-size:1.35rem; }
      main h3 { font-size:1.1rem; }
      main table { display:block; border:0; }
      main thead { display:none; }
      main tbody, main tr, main td { display:block; width:100%; min-width:0; }
      main tr { margin:1rem 0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; }
      main td { display:grid; grid-template-columns:minmax(5.2rem,30%) minmax(0,1fr); gap:.7rem; padding:.55rem .7rem; border:0; border-bottom:1px solid var(--line); }
      main td:last-child { border-bottom:0; }
      main td::before { content:attr(data-label); font-weight:700; color:var(--green); }
      main td:only-child { display:block; }
      main td:only-child::before { display:none; }
      main td:only-child .cell-value { grid-column:1; }
    }
  </style>
</head>
<body>
  <header class="hero"><div class="hero-inner">
    <div class="eyebrow">ITALIA · 2026 TRAVEL JOURNAL</div>
    <h1>🇮🇹 2026 義大利自由行</h1>
    <p>完整行程手冊｜羅馬 → 佛羅倫斯 → 威尼斯 Mestre → 羅馬</p>
  </div></header>
  <div class="layout"><main id="content"><div class="status">正在載入 Markdown…</div></main></div>
  <div class="quick-tools">
    <div class="quick-panel" id="quick-panel">
      <button class="quick-action" id="open-currency">💱 匯率換算</button>
      <button class="quick-action" id="open-days">📅 每日行程</button>
    </div>
  </div>
  <div class="modal" id="daily-modal" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="daily-title">
      <div class="modal-row"><h2 id="daily-title">📅 每日行程</h2><button class="modal-close" id="close-daily" aria-label="關閉">×</button></div>
      <nav id="quick-guide" aria-label="每日行程"></nav>
    </section>
  </div>
  <div class="modal" id="currency-modal" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="currency-title">
      <div class="modal-row"><h2 id="currency-title">💱 EUR ↔ TWD 匯率換算</h2><button class="modal-close" id="close-currency" aria-label="關閉">×</button></div>
      <label for="currency-direction">換算方向</label>
      <select id="currency-direction"><option value="eur-twd">EUR → TWD</option><option value="twd-eur">TWD → EUR</option></select>
      <label for="currency-amount">金額</label>
      <input id="currency-amount" type="number" min="0" step="0.01" value="100" inputmode="decimal">
      <div class="rate-result" id="rate-result">請輸入金額</div>
      <p class="rate-note">固定匯率：1 EUR = 36.72 TWD。實際刷卡或現金兌換匯率可能不同。</p>
    </section>
  </div>
  <script>
    const mapPlaces = [
      ['The Independent Hotel', 'The Independent Hotel Rome'],
      ['Florence Luxury Suites', 'Florence Luxury Suites'],
      ['Leonardo Royal Hotel Venice Mestre', 'Leonardo Royal Hotel Venice Mestre'],
      ['梵蒂岡博物館', 'Vatican Museums Rome'], ['聖彼得大教堂', 'St Peters Basilica Vatican'],
      ['聖彼得圓頂', 'St Peters Dome Vatican'], ['聖天使堡', 'Castel Sant Angelo Rome'],
      ['羅馬競技場', 'Colosseum Rome'], ['競技場', 'Colosseum Rome'], ['古羅馬廣場', 'Roman Forum Rome'],
      ['帕拉蒂尼山', 'Palatine Hill Rome'], ['真理之口', 'Bocca della Verita Rome'], ['橘園', 'Orange Garden Rome'],
      ['百花大教堂', 'Duomo Florence'], ['學院美術館', 'Galleria dell Accademia Florence'],
      ['米開朗基羅廣場', 'Piazzale Michelangelo Florence'], ['烏菲茲美術館', 'Uffizi Gallery Florence'],
      ['里亞托橋', 'Rialto Bridge Venice'], ['聖馬可廣場', 'St Marks Square Venice'],
      ['總督宮', 'Doge Palace Venice'], ['聖馬可大教堂', 'St Marks Basilica Venice'],
      ['Roma Termini', 'Roma Termini'], ['Firenze S. M. Novella', 'Firenze Santa Maria Novella'],
      ['Venezia Mestre', 'Venezia Mestre Station'], ['Venezia Santa Lucia', 'Venezia Santa Lucia Station']
    ].sort((a, b) => b[0].length - a[0].length);

    function addMapLinks(root) {
      const mapByLabel = new Map(mapPlaces);
      root.querySelectorAll('a').forEach(anchor => {
        const label = anchor.textContent.trim();
        if (mapByLabel.has(label) && !label.startsWith('📍')) {
          anchor.textContent = '📍 ' + label;
          anchor.classList.add('place-link');
          anchor.target = '_blank';
          anchor.rel = 'noreferrer';
        }
      });
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (node.parentElement.closest('a,code,script,style')) continue;
        if (mapPlaces.some(([label]) => node.nodeValue.includes(label))) nodes.push(node);
      }
      nodes.forEach(node => {
        let text = node.nodeValue;
        const fragment = document.createDocumentFragment();
        while (text) {
          let hit = null;
          mapPlaces.forEach(([label, query]) => {
            const index = text.indexOf(label);
            if (index >= 0 && (!hit || index < hit.index || (index === hit.index && label.length > hit.label.length))) hit = {index, label, query};
          });
          if (!hit) { fragment.append(text); break; }
          if (hit.index) fragment.append(text.slice(0, hit.index));
          const link = document.createElement('a');
          link.className = 'place-link'; link.target = '_blank'; link.rel = 'noreferrer';
          link.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(hit.query);
          link.textContent = '📍 ' + hit.label;
          fragment.append(link);
          text = text.slice(hit.index + hit.label.length);
        }
        node.replaceWith(fragment);
      });
    }

    function makeDayAccordions(content) {
      [...content.querySelectorAll('h2')].filter(h => /^\d{2}\/\d{2}/.test(h.textContent.trim())).forEach((heading, index) => {
        const details = document.createElement('details');
        details.className = 'day-card';
        details.id = 'day-' + index;
        const summary = document.createElement('summary');
        summary.textContent = heading.textContent;
        details.append(summary);
        heading.parentNode.insertBefore(details, heading);
        let node = heading.nextSibling;
        heading.remove();
        while (node && !(node.nodeType === 1 && node.matches('h2'))) {
          const next = node.nextSibling;
          details.append(node);
          node = next;
        }
      });
    }

    function groupTableCellContent(content) {
      content.querySelectorAll('table tbody td').forEach(cell => {
        if (cell.querySelector(':scope > .cell-value')) return;
        const value = document.createElement('span');
        value.className = 'cell-value';
        while (cell.firstChild) value.append(cell.firstChild);
        cell.append(value);
      });
    }

    function removeSectionByTitle(content, title) {
      [...content.querySelectorAll('h2')].filter(heading => heading.textContent.includes(title)).forEach(heading => {
        let node = heading.nextSibling;
        heading.remove();
        while (node && !(node.nodeType === 1 && node.matches('h2'))) {
          const next = node.nextSibling;
          node.remove();
          node = next;
        }
      });
    }

    function buildDailyMenu(content) {
      const dailyMenu = document.getElementById('quick-guide');
      const days = [...content.querySelectorAll('details.day-card')];
      dailyMenu.innerHTML = days.map((day, index) => {
        const id = day.id || 'day-' + index;
        day.id = id;
        return `<a href="#${id}">${day.querySelector('summary').textContent}</a>`;
      }).join('');
      dailyMenu.querySelectorAll('a').forEach(link => link.addEventListener('click', event => {
        event.preventDefault();
        const target = document.getElementById(link.getAttribute('href').slice(1));
        if (target) { target.open = true; target.scrollIntoView({behavior:'smooth', block:'start'}); }
        document.getElementById('daily-modal').hidden = true;
      }));
    }

    async function loadItinerary() {
      const content = document.getElementById('content');
      try {
        const response = await fetch('itinerary.md');
        if (!response.ok) throw new Error('Markdown 載入失敗');
        const markdown = await response.text();
        content.innerHTML = marked.parse(markdown);
        removeSectionByTitle(content, '快速導覽');
        [...content.querySelectorAll('p')].filter(p => /^(檔案用途|狀態註記原則)/.test(p.textContent.trim())).forEach(p => p.remove());
        content.querySelectorAll('table').forEach(table => {
          const labels = [...table.querySelectorAll('thead th')].map(cell => cell.textContent.trim());
          table.querySelectorAll('tbody tr').forEach(row => {
            [...row.children].forEach((cell, index) => cell.setAttribute('data-label', labels[index] || ''));
          });
        });
        makeDayAccordions(content);
        addMapLinks(content);
        groupTableCellContent(content);
        buildDailyMenu(content);
      } catch (error) {
        content.innerHTML = '<div class="status">無法載入行程內容，請確認 itinerary.md 與本頁位於同一個資料夾。</div>';
        document.getElementById('quick-guide').innerHTML = '';
      }
    }

    const eurTwdRate = 36.72;
    function updateConversion() {
      const amount = Number(document.getElementById('currency-amount').value) || 0;
      const direction = document.getElementById('currency-direction').value;
      const converted = direction === 'eur-twd' ? amount * eurTwdRate : amount / eurTwdRate;
      const from = direction === 'eur-twd' ? 'EUR' : 'TWD';
      const to = direction === 'eur-twd' ? 'TWD' : 'EUR';
      document.getElementById('rate-result').textContent = `${Math.round(converted).toLocaleString()} ${to}`;
    }
    document.getElementById('open-currency').addEventListener('click', () => {
      document.getElementById('currency-modal').hidden = false;
      updateConversion();
    });
    document.getElementById('close-currency').addEventListener('click', () => document.getElementById('currency-modal').hidden = true);
    document.getElementById('currency-modal').addEventListener('click', event => { if (event.target.id === 'currency-modal') event.currentTarget.hidden = true; });
    document.getElementById('close-daily').addEventListener('click', () => document.getElementById('daily-modal').hidden = true);
    document.getElementById('daily-modal').addEventListener('click', event => { if (event.target.id === 'daily-modal') event.currentTarget.hidden = true; });
    ['currency-direction','currency-amount'].forEach(id => document.getElementById(id).addEventListener('input', updateConversion));
    document.getElementById('open-days').addEventListener('click', () => {
      document.getElementById('daily-modal').hidden = false;
    });
    loadItinerary();
  </script>
</body>
</html>
